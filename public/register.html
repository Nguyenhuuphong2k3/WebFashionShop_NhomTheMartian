<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav id="navbar">
      <a href="/">Trang Chủ</a>
      <a href="/products.html">Sản Phẩm</a>
      <a href="/categories.html">Thể Loại</a>
      <a href="/login.html" id="loginLink">Đăng Nhập</a>
      <a href="/register.html" id="registerLink">Đăng Ký</a>
      <div id="userInfo" style="display: none;">
        <span id="usernameDisplay"></span>
        <button class="action-btn" onclick="logout()">Đăng Xuất</button>
      </div>
    </nav>
  </header>

  <div class="auth-container">
    <h3>Đăng ký tài khoản</h3>
    <form id="registerForm">
      <div>
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Đăng ký</button>
    </form>
    <p class="text-center mt-3">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
    <div id="registerMsg" class="text-center"></div>
    <div class="loading" id="registerLoading"></div>
  </div>

  <footer>
    <p>© 2025 - Website Bán Hàng</p>
  </footer>

  <script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await response.json();

        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const userInfo = document.getElementById('userInfo');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (data.success) {
          loginLink.style.display = 'none';
          registerLink.style.display = 'none';
          userInfo.style.display = 'flex';
          usernameDisplay.textContent = `Chào, ${data.data.username}`;
        }
      } catch (error) {
        console.error('Error checking auth:', error);
      }
    });

    // Xử lý đăng ký
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('registerMsg');
      const loading = document.getElementById('registerLoading');

      msg.innerHTML = '';
      loading.style.display = 'block';

      try {
        const response = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
          credentials: 'include'
        });

        const data = await response.json();
        loading.style.display = 'none';

        if (data.success) {
          msg.innerHTML = `<div class="alert alert-success">Đăng ký thành công! <a href="/login.html">Đăng nhập</a></div>`;
        } else {
          msg.innerHTML = `<div class="alert alert-danger">Lỗi: ${data.message || "Không thể đăng ký."}</div>`;
        }
      } catch (error) {
        loading.style.display = 'none';
        msg.innerHTML = `<div class="alert alert-danger">Lỗi: ${error.message}</div>`;
      }
    });

    // Hàm đăng xuất
    async function logout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        window.location.href = "/";
      } catch (error) {
        console.error('Error logging out:', error);
        window.location.href = "/";
      }
    }
  </script>
</body>
</html>
