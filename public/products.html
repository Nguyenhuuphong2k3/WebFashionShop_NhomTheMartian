<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản Phẩm - Fashion Shop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="logo-container">
        <img src="/uploads/logo.png" alt="Fashion Shop Logo">
        <span>Fashion Shop</span>
      </div>
      <div class="nav-links">
        <a href="/">Trang Chủ</a>
        <a href="/products.html">Sản Phẩm</a>
        <a href="/categories.html">Thể Loại</a>
        <a href="/cart.html">Giỏ Hàng</a>
        <a href="/orders.html">Đơn Hàng</a>
        <a href="/login.html" id="loginLink">Đăng Nhập</a>
        <a href="/register.html" id="registerLink">Đăng Ký</a>
        <div id="userInfo" style="display: none;">
          <span id="usernameDisplay"></span>
          <button class="action-btn" onclick="logout()">Đăng Xuất</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Danh sách sản phẩm</h2>
    <button class="btn" onclick="openModal('addProduct')">Thêm Sản Phẩm</button>
    <div id="product-list" class="grid"></div>
  </main>

  <!-- Modal để thêm/sửa/xem chi tiết sản phẩm -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 - Fashion Shop</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          credentials: 'include',
        });
        const data = await response.json();

        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const userInfo = document.getElementById('userInfo');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (data.success) {
          loginLink.style.display = 'none';
          registerLink.style.display = 'none';
          userInfo.style.display = 'flex';
          usernameDisplay.textContent = `Chào, ${data.data.username}`;
          window.isLoggedIn = true;
          window.currentUser = data.data;
        } else {
          window.isLoggedIn = false;
          window.currentUser = null;
        }
        loadProducts();
      } catch (error) {
        console.error('Error checking auth:', error);
        window.isLoggedIn = false;
        window.currentUser = null;
        loadProducts();
      }
    });

    // Hàm tải danh sách sản phẩm
    async function loadProducts() {
      const container = document.getElementById('product-list');
      try {
        const response = await fetch('/products', {
          method: 'GET',
          credentials: 'include',
        });
        const data = await response.json();

        container.innerHTML = ''; // Xóa nội dung cũ
        if (data.success && data.data.length > 0) {
          data.data.forEach(product => {
            const div = document.createElement('div');
            div.className = 'product-item';
            const imageSrc = product.imgURL && product.imgURL !== '' ? product.imgURL : '/images/default-image.jpg';
            // Tính giá sau khuyến mãi (nếu có)
            let discountedPrice = product.price;
            let promotionText = '';
            if (product.promotionIDs && product.promotionIDs.length > 0) {
              const activePromotion = product.promotionIDs.find(promo => {
                const now = new Date();
                return now >= new Date(promo.startDate) && now <= new Date(promo.endDate);
              });
              if (activePromotion) {
                discountedPrice = product.price * (1 - activePromotion.discountPercentage / 100);
                promotionText = `(Giảm ${activePromotion.discountPercentage}% - ${activePromotion.promotionName})`;
              }
            }
            div.innerHTML = `
              <img src="${imageSrc}" alt="${product.productName}" style="max-width: 200px;" onerror="this.src='/images/default-image.jpg'" />
              <h3>${product.productName}</h3>
              <p>Giá: ${product.price}₫ ${promotionText}</p>
              ${promotionText ? `<p>Giá sau khuyến mãi: ${discountedPrice.toFixed(0)}₫</p>` : ''}
              <p>Số lượng: ${product.quantity}</p>
              <p>Mô tả: ${product.description || 'Không có'}</p>
              <button class="btn btn-success" onclick="addToCart('${product._id}')">Thêm vào giỏ hàng</button>
              <button class="btn" onclick="openModal('viewProduct', '${product._id}')">Xem chi tiết</button>
              <button class="btn" onclick="openModal('editProduct', '${product._id}')">Sửa</button>
              <button class="btn btn-danger" onclick="deleteProduct('${product._id}')">Xóa</button>
            `;
            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<p>Không có sản phẩm nào!</p>';
        }
      } catch (error) {
        console.error('Error fetching products:', error);
        container.innerHTML = '<p>Lỗi khi tải sản phẩm!</p>';
      }
    }

    // Hàm mở modal để thêm/sửa/xem chi tiết sản phẩm
    async function openModal(mode, productId = null) {
      const modal = document.getElementById('modal');
      const modalBody = document.getElementById('modal-body');
      modal.style.display = 'block';

      if (mode === 'addProduct') {
        // Lấy danh sách danh mục từ API
        let categories = [];
        try {
          const response = await fetch('/categories', {
            method: 'GET',
            credentials: 'include',
          });
          const data = await response.json();
          console.log('Categories response:', data); // Debug để kiểm tra dữ liệu trả về
          if (data.success && Array.isArray(data.data)) {
            categories = data.data;
          } else {
            console.error('Error: Categories data is not in expected format:', data);
            alert('Không thể tải danh mục: Dữ liệu không đúng định dạng.');
          }
        } catch (error) {
          console.error('Error fetching categories:', error);
          alert('Lỗi khi tải danh mục: ' + error.message);
        }

        modalBody.innerHTML = `
          <h2>Thêm Sản Phẩm</h2>
          <form id="productForm" enctype="multipart/form-data">
            <label for="productName">Tên Sản Phẩm:</label>
            <input type="text" id="productName" name="productName" required />
            
            <label for="price">Giá:</label>
            <input type="number" id="price" name="price" min="0" required />
            
            <label for="quantity">Số lượng:</label>
            <input type="number" id="quantity" name="quantity" min="0" required />
            
            <label for="image">Hình Ảnh:</label>
            <input type="file" id="image" name="image" accept="image/*" required />
            
            <label for="categoryID">Danh Mục:</label>
            <select id="categoryID" name="categoryID" required>
              <option value="">Chọn danh mục</option>
              ${categories.length > 0 ? categories.map(category => `
                <option value="${category._id}">${category.categoryName}</option>
              `).join('') : '<option value="" disabled>Không có danh mục nào</option>'}
            </select>
            
            <label for="description">Mô Tả:</label>
            <textarea id="description" name="description"></textarea>
            
            <button type="submit" class="btn">Thêm</button>
          </form>
        `;

        const form = document.getElementById('productForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const formData = new FormData(form);

          try {
            const response = await fetch('/products', {
              method: 'POST',
              body: formData,
              credentials: 'include',
            });
            const result = await response.json();
            if (result.success) {
              closeModal();
              loadProducts();
            } else {
              alert('Error adding product: ' + result.message);
            }
          } catch (error) {
            alert('Error adding product: ' + error.message);
          }
        });
      } else if (mode === 'editProduct') {
        // Lấy thông tin sản phẩm
        fetch(`/products/${productId}`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              const product = data.data;
              // Lấy danh sách danh mục
              fetch('/categories', { credentials: 'include' })
                .then(res => res.json())
                .then(categoriesData => {
                  console.log('Categories response (edit):', categoriesData); // Debug để kiểm tra dữ liệu trả về
                  let categories = [];
                  if (categoriesData.success && Array.isArray(categoriesData.data)) {
                    categories = categoriesData.data;
                  } else {
                    console.error('Error: Categories data is not in expected format:', categoriesData);
                    alert('Không thể tải danh mục: Dữ liệu không đúng định dạng.');
                  }

                  modalBody.innerHTML = `
                    <h2>Sửa Sản Phẩm</h2>
                    <form id="productForm" enctype="multipart/form-data">
                      <label for="productName">Tên Sản Phẩm:</label>
                      <input type="text" id="productName" name="productName" value="${product.productName}" required />
                      
                      <label for="price">Giá:</label>
                      <input type="number" id="price" name="price" value="${product.price}" min="0" required />
                      
                      <label for="quantity">Số lượng:</label>
                      <input type="number" id="quantity" name="quantity" value="${product.quantity}" min="0" required />
                      
                      <label for="image">Hình Ảnh (để trống nếu không thay đổi):</label>
                      <input type="file" id="image" name="image" accept="image/*" />
                      <p>Hình ảnh hiện tại: <img src="${product.imgURL || '/images/default-image.jpg'}" alt="${product.productName}" style="max-width: 100px;" onerror="this.src='/images/default-image.jpg'" /></p>
                      <input type="hidden" name="imgURL" value="${product.imgURL}" />
                      
                      <label for="categoryID">Danh Mục:</label>
                      <select id="categoryID" name="categoryID" required>
                        <option value="">Chọn danh mục</option>
                        ${categories.length > 0 ? categories.map(category => `
                          <option value="${category._id}" ${category._id === product.categoryID._id ? 'selected' : ''}>${category.categoryName}</option>
                        `).join('') : '<option value="" disabled>Không có danh mục nào</option>'}
                      </select>
                      
                      <label for="description">Mô Tả:</label>
                      <textarea id="description" name="description">${product.description || ''}</textarea>
                      
                      <button type="submit" class="btn">Cập Nhật</button>
                    </form>
                  `;

                  const form = document.getElementById('productForm');
                  form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const formData = new FormData(form);

                    try {
                      const response = await fetch(`/products/${productId}`, {
                        method: 'PUT',
                        body: formData,
                        credentials: 'include',
                      });
                      const result = await response.json();
                      if (result.success) {
                        closeModal();
                        loadProducts();
                      } else {
                        alert('Error updating product: ' + result.message);
                      }
                    } catch (error) {
                      alert('Error updating product: ' + error.message);
                    }
                  });
                })
                .catch(error => {
                  console.error('Error fetching categories:', error);
                  alert('Lỗi khi tải danh mục: ' + error.message);
                });
            } else {
              alert('Error loading product: ' + data.message);
            }
          })
          .catch(error => {
            console.error('Error fetching product:', error);
            alert('Error loading product');
          });
      } else if (mode === 'viewProduct') {
        // Lấy thông tin sản phẩm
        fetch(`/products/${productId}`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              const product = data.data;
              // Tính giá sau khuyến mãi
              let discountedPrice = product.price;
              let promotionText = '';
              if (product.promotionIDs && product.promotionIDs.length > 0) {
                const activePromotion = product.promotionIDs.find(promo => {
                  const now = new Date();
                  return now >= new Date(promo.startDate) && now <= new Date(promo.endDate);
                });
                if (activePromotion) {
                  discountedPrice = product.price * (1 - activePromotion.discountPercentage / 100);
                  promotionText = `(Giảm ${activePromotion.discountPercentage}% - ${activePromotion.promotionName})`;
                }
              }
              // Lấy danh sách đánh giá
              fetch(`/reviews?productID=${productId}`, { credentials: 'include' })
                .then(res => res.json())
                .then(reviewsData => {
                  const reviews = reviewsData.success ? reviewsData.data : [];
                  modalBody.innerHTML = `
                    <h2>Chi tiết sản phẩm</h2>
                    <div class="product-details">
                      <img src="${product.imgURL || '/images/default-image.jpg'}" alt="${product.productName}" style="max-width: 200px;" onerror="this.src='/images/default-image.jpg'" />
                      <h3>${product.productName}</h3>
                      <p>Giá gốc: ${product.price}₫ ${promotionText}</p>
                      ${promotionText ? `<p>Giá sau khuyến mãi: ${discountedPrice.toFixed(0)}₫</p>` : ''}
                      <p>Số lượng: ${product.quantity}</p>
                      <p>Danh mục: ${product.categoryID ? product.categoryID.categoryName : 'Không có danh mục'}</p>
                      <p>Mô tả: ${product.description || 'Không có'}</p>
                      <button class="btn btn-success" onclick="addToCart('${product._id}')">Thêm vào giỏ hàng</button>
                      <button class="btn" onclick="openModal('editProduct', '${product._id}')">Sửa</button>
                      <button class="btn btn-danger" onclick="deleteProduct('${product._id}')">Xóa</button>
                    </div>
                    <h3>Đánh giá sản phẩm</h3>
                    <div id="reviews-list">
                      ${reviews.length > 0 ? reviews.map(review => `
                        <div class="review-item">
                          <p><strong>${review.userID ? review.userID.username : 'Ẩn danh'}</strong> (${new Date(review.createdAt).toLocaleDateString()}): ${review.rating}/5 sao</p>
                          <p>${review.comment}</p>
                        </div>
                      `).join('') : '<p>Chưa có đánh giá nào.</p>'}
                    </div>
                    ${window.isLoggedIn ? `
                      <h3>Thêm đánh giá của bạn</h3>
                      <form id="reviewForm">
                        <label for="rating">Điểm (1-5):</label>
                        <input type="number" id="rating" name="rating" min="1" max="5" required />
                        <label for="comment">Bình luận:</label>
                        <textarea id="comment" name="comment" required></textarea>
                        <button type="submit" class="btn">Gửi đánh giá</button>
                      </form>
                    ` : '<p>Vui lòng đăng nhập để đánh giá sản phẩm.</p>'}
                  `;

                  // Xử lý gửi đánh giá
                  const reviewForm = document.getElementById('reviewForm');
                  if (reviewForm) {
                    reviewForm.addEventListener('submit', async (e) => {
                      e.preventDefault();
                      const rating = reviewForm.querySelector('#rating').value;
                      const comment = reviewForm.querySelector('#comment').value;

                      try {
                        const response = await fetch('/reviews', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ productID: productId, rating, comment }),
                          credentials: 'include',
                        });
                        const result = await response.json();
                        if (result.success) {
                          alert('Đánh giá đã được gửi!');
                          openModal('viewProduct', productId); // Tải lại modal để hiển thị đánh giá mới
                        } else {
                          alert('Error submitting review: ' + result.message);
                        }
                      } catch (error) {
                        alert('Error submitting review: ' + error.message);
                      }
                    });
                  }
                })
                .catch(error => {
                  console.error('Error fetching reviews:', error);
                  modalBody.innerHTML = `
                    <h2>Chi tiết sản phẩm</h2>
                    <div class="product-details">
                      <img src="${product.imgURL || '/images/default-image.jpg'}" alt="${product.productName}" style="max-width: 200px;" onerror="this.src='/images/default-image.jpg'" />
                      <h3>${product.productName}</h3>
                      <p>Giá gốc: ${product.price}₫ ${promotionText}</p>
                      ${promotionText ? `<p>Giá sau khuyến mãi: ${discountedPrice.toFixed(0)}₫</p>` : ''}
                      <p>Số lượng: ${product.quantity}</p>
                      <p>Danh mục: ${product.categoryID ? product.categoryID.categoryName : 'Không có danh mục'}</p>
                      <p>Mô tả: ${product.description || 'Không có'}</p>
                      <button class="btn btn-success" onclick="addToCart('${product._id}')">Thêm vào giỏ hàng</button>
                      <button class="btn" onclick="openModal('editProduct', '${product._id}')">Sửa</button>
                      <button class="btn btn-danger" onclick="deleteProduct('${product._id}')">Xóa</button>
                    </div>
                    <h3>Đánh giá sản phẩm</h3>
                    <p>Lỗi khi tải đánh giá.</p>
                  `;
                });
            } else {
              alert('Error loading product: ' + data.message);
            }
          })
          .catch(error => {
            console.error('Error fetching product:', error);
            alert('Error loading product');
          });
      }
    }

    // Hàm thêm sản phẩm vào giỏ hàng
    async function addToCart(productId) {
      if (!window.isLoggedIn) {
        alert('Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng!');
        window.location.href = '/login.html';
        return;
      }
      try {
        const response = await fetch('/cart/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity: 1 }),
          credentials: 'include',
        });
        const result = await response.json();
        if (result.success) {
          alert('Sản phẩm đã được thêm vào giỏ hàng!');
        } else {
          alert('Error adding to cart: ' + result.message);
        }
      } catch (error) {
        alert('Error adding to cart: ' + error.message);
      }
    }

    // Hàm xóa sản phẩm
    async function deleteProduct(productId) {
      if (confirm('Bạn có chắc muốn xóa sản phẩm này?')) {
        try {
          const response = await fetch(`/products/${productId}`, {
            method: 'DELETE',
            credentials: 'include',
          });
          const result = await response.json();
          if (result.success) {
            closeModal();
            loadProducts();
          } else {
            alert('Error deleting product: ' + result.message);
          }
        } catch (error) {
          alert('Error deleting product: ' + error.message);
        }
      }
    }

    // Hàm đóng modal
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // Hàm đăng xuất
    async function logout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include',
        });
        document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        window.location.href = '/';
      } catch (error) {
        console.error('Error logging out:', error);
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
