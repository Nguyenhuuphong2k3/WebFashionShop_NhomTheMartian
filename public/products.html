<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản Phẩm - Fashion Shop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="logo-container">
        <img src="/uploads/logo.png" alt="Fashion Shop Logo">
        <span>Fashion Shop</span>
      </div>
      <div class="nav-links">
        <a href="/">Trang Chủ</a>
        <a href="/products.html">Sản Phẩm</a>
        <a href="/categories.html">Thể Loại</a>
        <a href="/cart.html">Giỏ Hàng</a>
        <a href="/orders.html">Đơn Hàng</a>
        <a href="/promotions.html">Khuyến Mãi</a>
        <a href="/login.html" id="loginLink">Đăng Nhập</a>
        <a href="/register.html" id="registerLink">Đăng Ký</a>
        <div id="userInfo" style="display: none;">
          <span id="usernameDisplay"></span>
          <button class="action-btn" onclick="logout()">Đăng Xuất</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Danh sách sản phẩm</h2>
    <button class="btn" onclick="openModal('addProduct')">Thêm Sản Phẩm</button>
    <div id="product-list" class="grid"></div>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 - Fashion Shop</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          credentials: 'include',
        });
        const data = await response.json();

        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const userInfo = document.getElementById('userInfo');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (data.success) {
          window.isLoggedIn = true;
          window.userRole = data.data.role;
          window.currentUser = data.data;
          loginLink.style.display = 'none';
          registerLink.style.display = 'none';
          userInfo.style.display = 'flex';
          usernameDisplay.textContent = `Chào, ${data.data.username}`;
        } else {
          window.isLoggedIn = false;
          window.userRole = null;
          window.currentUser = null;
        }
        loadProducts(); // Tải danh sách sản phẩm
      } catch (error) {
        console.error('Error checking auth:', error);
        window.isLoggedIn = false;
        window.userRole = null;
        window.currentUser = null;
        loadProducts();
      }
    });

    // Hàm mở modal để thêm/sửa sản phẩm
    async function openModal(mode, productId = null) {
      const modal = document.getElementById('modal');
      const modalBody = document.getElementById('modal-body');
      modal.style.display = 'block';

      if (mode === 'addProduct') {
        // Lấy danh sách danh mục từ API
        let categories = [];
        try {
          const response = await fetch('/categories', {
            method: 'GET',
            credentials: 'include',
          });
          categories = await response.json();
        } catch (error) {
          console.error('Error fetching categories:', error);
          categories = [];
        }

        modalBody.innerHTML = `
          <h2>Thêm Sản Phẩm</h2>
          <form id="productForm" enctype="multipart/form-data">
            <label for="productName">Tên Sản Phẩm:</label>
            <input type="text" id="productName" name="productName" required />
            
            <label for="price">Giá:</label>
            <input type="number" id="price" name="price" min="0" required />
            
            <label for="quantity">Số lượng:</label>
            <input type="number" id="quantity" name="quantity" min="0" required />
            
            <label for="image">Hình Ảnh:</label>
            <input type="file" id="image" name="image" accept="image/*" required />
            
            <label for="category">Danh Mục:</label>
            <select id="category" name="category" required>
              <option value="">Chọn danh mục</option>
              ${categories.length > 0 ? categories.map(category => `
                <option value="${category._id}">${category.categoryName}</option>
              `).join('') : '<option value="">Không có danh mục</option>'}
            </select>
            
            <label for="description">Mô Tả:</label>
            <textarea id="description" name="description"></textarea>
            
            <button type="submit" class="btn">Thêm</button>
          </form>
        `;

        const form = document.getElementById('productForm');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(form);
          // Không cần thêm các trường riêng lẻ vì FormData đã bao gồm tất cả, kể cả file

          try {
            const response = await fetch('/products', {
              method: 'POST',
              body: formData,
              credentials: 'include',
            });
            const result = await response.json();
            if (result.success) {
              closeModal();
              loadProducts();
            } else {
              alert('Error adding product: ' + result.message);
            }
          } catch (error) {
            alert('Error adding product: ' + error.message);
          }
        });
      } else if (mode === 'editProduct') {
        // Logic sửa sản phẩm
        fetch(`/products/${productId}`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              const product = data.data;
              // Lấy danh sách danh mục để hiển thị trong dropdown
              fetch('/categories', { credentials: 'include' })
                .then(res => res.json())
                .then(categories => {
                  modalBody.innerHTML = `
                    <h2>Sửa Sản Phẩm</h2>
                    <form id="productForm" enctype="multipart/form-data">
                      <label for="productName">Tên Sản Phẩm:</label>
                      <input type="text" id="productName" name="productName" value="${product.productName}" required />
                      
                      <label for="price">Giá:</label>
                      <input type="number" id="price" name="price" value="${product.price}" min="0" required />
                      
                      <label for="quantity">Số lượng:</label>
                      <input type="number" id="quantity" name="quantity" value="${product.quantity}" min="0" required />
                      
                      <label for="image">Hình Ảnh (để trống nếu không thay đổi):</label>
                      <input type="file" id="image" name="image" accept="image/*" />
                      <p>Hình ảnh hiện tại: <img src="${product.image}" alt="${product.productName}" style="max-width: 100px;" /></p>
                      
                      <label for="category">Danh Mục:</label>
                      <select id="category" name="category" required>
                        <option value="">Chọn danh mục</option>
                        ${categories.length > 0 ? categories.map(category => `
                          <option value="${category._id}" ${category._id === product.category ? 'selected' : ''}>${category.categoryName}</option>
                        `).join('') : '<option value="">Không có danh mục</option>'}
                      </select>
                      
                      <label for="description">Mô Tả:</label>
                      <textarea id="description" name="description">${product.description || ''}</textarea>
                      
                      <button type="submit" class="btn">Cập Nhật</button>
                    </form>
                  `;

                  const form = document.getElementById('productForm');
                  form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const formData = new FormData(form);

                    try {
                      const response = await fetch(`/products/${productId}`, {
                        method: 'PUT',
                        body: formData,
                        credentials: 'include',
                      });
                      const result = await response.json();
                      if (result.success) {
                        closeModal();
                        loadProducts();
                      } else {
                        alert('Error updating product: ' + result.message);
                      }
                    } catch (error) {
                      alert('Error updating product: ' + error.message);
                    }
                  });
                })
                .catch(error => {
                  console.error('Error fetching categories:', error);
                  alert('Error loading categories for edit form');
                });
            } else {
              alert('Error loading product: ' + data.message);
            }
          })
          .catch(error => {
            console.error('Error fetching product:', error);
            alert('Error loading product');
          });
      }
    }

    // Hàm đóng modal
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // Hàm đăng xuất
    async function logout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include',
        });
        document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        window.location.href = '/';
      } catch (error) {
        console.error('Error logging out:', error);
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
