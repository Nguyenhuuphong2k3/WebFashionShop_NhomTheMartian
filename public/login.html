<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav id="navbar">
      <a href="/">Trang Chủ</a>
      <a href="/products.html">Sản Phẩm</a>
      <a href="/categories.html">Thể Loại</a>
      <a href="/login.html" id="loginLink">Đăng Nhập</a>
      <a href="/register.html" id="registerLink">Đăng Ký</a>
      <div id="userInfo" style="display: none;">
        <span id="usernameDisplay"></span>
        <button class="action-btn" onclick="logout()">Đăng Xuất</button>
      </div>
    </nav>
  </header>

  <div class="auth-container">
    <h3>Đăng nhập</h3>
    <form id="loginForm">
      <div>
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="text-center mt-3"><a href="#">Quên mật khẩu?</a></p>
    <p class="text-center">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></p>
    <div id="loginMsg" class="text-center"></div>
    <div class="loading" id="loginLoading"></div>
  </div>

  <footer>
    <p>© 2025 - Website Bán Hàng</p>
  </footer>

  <script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await response.json();

        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const userInfo = document.getElementById('userInfo');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (data.success) {
          loginLink.style.display = 'none';
          registerLink.style.display = 'none';
          userInfo.style.display = 'flex';
          usernameDisplay.textContent = `Chào, ${data.data.username}`;
        }
      } catch (error) {
        console.error('Error checking auth:', error);
      }
    });

    // Xử lý đăng nhập
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('loginMsg');
      const loading = document.getElementById('loginLoading');

      msg.innerHTML = '';
      loading.style.display = 'block';

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include' // Gửi cookie trong request
        });

        const data = await response.json();
        loading.style.display = 'none';

        if (data.success) {
          msg.innerHTML = `<div class="alert alert-success">Đăng nhập thành công! Chuyển hướng...</div>`;
          setTimeout(() => {
            window.location.href = "/";
          }, 1500);
        } else {
          msg.innerHTML = `<div class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu.</div>`;
        }
      } catch (error) {
        loading.style.display = 'none';
        msg.innerHTML = `<div class="alert alert-danger">Lỗi: ${error.message}</div>`;
      }
    });

    // Hàm đăng xuất
    async function logout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        window.location.href = "/";
      } catch (error) {
        console.error('Error logging out:', error);
        window.location.href = "/";
      }
    }
  </script>
</body>
</html>
