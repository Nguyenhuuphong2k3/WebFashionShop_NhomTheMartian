<!-- public/orders.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đơn Hàng - Fashion Shop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav id="navbar">
      <div class="logo-container">
        <img src="/images/logo.png" alt="Fashion Shop Logo">
        <span>Fashion Shop</span>
      </div>
      <div class="nav-links">
        <a href="/">Trang Chủ</a>
        <a href="/products.html">Sản Phẩm</a>
        <a href="/categories.html">Thể Loại</a>
        <a href="/cart.html">Giỏ Hàng</a>
        <a href="/orders.html">Đơn Hàng</a>
        <a href="/login.html" id="loginLink">Đăng Nhập</a>
        <a href="/register.html" id="registerLink">Đăng Ký</a>
        <div id="userInfo" style="display: none;">
          <span id="usernameDisplay"></span>
          <button class="action-btn" onclick="logout()">Đăng Xuất</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2>Đơn Hàng Của Bạn</h2>
    <div id="order-list" class="grid"></div>
  </main>

  <!-- Modal để chọn phương thức thanh toán -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closePaymentModal()">×</span>
      <div id="modal-body">
        <h2>Chọn phương thức thanh toán</h2>
        <form id="paymentForm">
          <label for="method">Phương thức thanh toán:</label>
          <select id="method" name="method" required>
            <option value="">Chọn phương thức</option>
            <option value="COD">Thanh toán khi nhận hàng (COD)</option>
            <option value="Credit Card">Thẻ tín dụng</option>
            <option value="Bank Transfer">Chuyển khoản ngân hàng</option>
          </select>
          <input type="hidden" id="orderId" name="orderId">
          <input type="hidden" id="total" name="total">
          <button type="submit">Thanh toán</button>
        </form>
        <div id="formMsg" class="text-center"></div>
        <div class="loading" id="formLoading"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 - Fashion Shop</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    // Kiểm tra trạng thái đăng nhập khi tải trang
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await response.json();

        const loginLink = document.getElementById('loginLink');
        const registerLink = document.getElementById('registerLink');
        const userInfo = document.getElementById('userInfo');
        const usernameDisplay = document.getElementById('usernameDisplay');

        if (data.success) {
          loginLink.style.display = 'none';
          registerLink.style.display = 'none';
          userInfo.style.display = 'flex';
          usernameDisplay.textContent = `Chào, ${data.data.username}`;
          window.isLoggedIn = true;
          window.userRole = data.data.role;
          loadOrders();
        } else {
          window.isLoggedIn = false;
          window.userRole = null;
          showToast('Vui lòng đăng nhập để xem đơn hàng!', 'error');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        }
      } catch (error) {
        console.error('Error checking auth:', error);
        window.isLoggedIn = false;
        window.userRole = null;
        showToast('Lỗi khi kiểm tra đăng nhập!', 'error');
      }
    });

    // Hàm tải danh sách đơn hàng
    async function loadOrders() {
      try {
        const response = await fetch('/orders', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await response.json();

        const orderList = document.getElementById('order-list');
        orderList.innerHTML = '';

        if (data.success && data.data && data.data.length > 0) {
          data.data.forEach(order => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
              <h4>Đơn hàng #${order._id}</h4>
              <p>Tổng cộng: ${order.total}₫</p>
              <p>Địa chỉ giao hàng: ${order.shippingAddress}</p>
              <p>Trạng thái: ${order.status}</p>
              <h5>Sản phẩm:</h5>
              <ul>
                ${order.items.map(item => `
                  <li>${item.product.productName} - Số lượng: ${item.quantity}</li>
                `).join('')}
              </ul>
              ${order.status === 'pending' ? `
                <button class="btn" onclick="openPaymentModal('${order._id}', ${order.total})">Thanh Toán</button>
              ` : ''}
            `;
            orderList.appendChild(div);
          });
        } else {
          orderList.innerHTML = '<p>Bạn chưa có đơn hàng nào!</p>';
        }
      } catch (error) {
        console.error('Error loading orders:', error);
        showToast('Lỗi khi tải đơn hàng!', 'error');
      }
    }

    // Hàm mở modal chọn phương thức thanh toán
    function openPaymentModal(orderId, total) {
      document.getElementById('orderId').value = orderId;
      document.getElementById('total').value = total;
      document.getElementById('paymentModal').style.display = 'block';
    }

    // Hàm đóng modal
    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    // Xử lý form thanh toán
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const orderId = formData.get('orderId');
      const total = formData.get('total');
      const method = formData.get('method');
      const msg = document.getElementById('formMsg');
      const loading = document.getElementById('formLoading');

      msg.innerHTML = '';
      loading.style.display = 'block';

      try {
        const response = await fetch('/payment/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ orderId, amount: parseFloat(total), method })
        });
        const data = await response.json();

        loading.style.display = 'none';
        if (data.success) {
          msg.innerHTML = `<div class="alert alert-success">Thanh toán thành công!</div>`;
          setTimeout(() => {
            closePaymentModal();
            loadOrders();
          }, 1500);
        } else {
          msg.innerHTML = `<div class="alert alert-danger">Lỗi khi thanh toán: ${data.message}</div>`;
        }
      } catch (error) {
        console.error('Error during payment:', error);
        loading.style.display = 'none';
        msg.innerHTML = `<div class="alert alert-danger">Lỗi khi thanh toán!</div>`;
      }
    });

    // Hàm đăng xuất
    async function logout() {
      try {
        await fetch('/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        document.cookie = 'token=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        window.location.href = "/";
      } catch (error) {
        console.error('Error logging out:', error);
        window.location.href = "/";
      }
    }
  </script>
</body>
</html>
